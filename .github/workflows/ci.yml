name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks (ShellCheck, JSON)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell syntax
        run: |
          for f in plugins/swift-harness/scripts/*.sh \
                   plugins/swift-harness/skills/setup/templates/verify.sh \
                   tests/run.sh tests/ios-fixture.sh tests/smoke/*.sh; do
            bash -n "$f"
          done

      # Warnings and errors only: info-level notes (e.g. backticks inside single-quoted
      # prompt text in the tests) are intentional and not checked.
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck -S warning -x -P plugins/swift-harness/scripts \
            plugins/swift-harness/scripts/*.sh \
            plugins/swift-harness/skills/setup/templates/verify.sh \
            tests/run.sh tests/ios-fixture.sh tests/smoke/*.sh

      - name: JSON manifests and templates
        run: |
          for f in .claude-plugin/marketplace.json \
                   plugins/swift-harness/.claude-plugin/plugin.json \
                   plugins/swift-harness/hooks/hooks.json \
                   plugins/swift-harness/skills/setup/templates/swift-harness.json \
                   plugins/swift-harness/skills/setup/templates/swift-format; do
            jq -e . "$f" > /dev/null && echo "ok $f"
          done

  hooks:
    name: Hook tests (macOS bash 3.2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tool versions
        run: |
          /bin/bash --version | head -1
          jq --version
          command -v swiftlint && swiftlint version || echo "swiftlint not installed"

      # /bin/bash on macOS is 3.2, the version the hooks must support.
      - name: tests/run.sh
        run: /bin/bash tests/run.sh

  swift-fixtures:
    name: Swift references compile (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Builds Tokens, PillCenter and SnapshotTest with the template helpers.
      # Snapshot tests are not run here: the visual fixture below runs the helper.
      - name: Build design-system references with tests
        working-directory: tests/fixtures/design-system
        run: swift build --build-tests

      # Color("name", bundle:) never fails when created: check every semantic color resolves.
      # xcodebuild, not swift test: with Xcode 26 the SwiftPM CLI copies Colors.xcassets
      # without compiling it, so no named color resolves (Xcode 27 compiles it).
      - name: Semantic colors resolve at runtime
        working-directory: tests/fixtures/design-system
        run: |
          xcodebuild test -scheme DesignSystem -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" -quiet \
            -only-testing:'DesignSystemTests/semanticColorResolves(_:)'

      # The LayoutContract helper from the setup templates (linked into the fixture) measures
      # screens that break at their minimum size, and passes the ones that hold.
      - name: Layout contract measures the fixture screens
        working-directory: tests/fixtures/layout
        run: swift test

      # The Screenshot helper (linked into the fixture) renders the fixture screens in an
      # offscreen window and saves PNG images for review; a blank capture fails the test.
      # The Snapshot helper compares with baselines made in the test; the committed gallery
      # baselines come from another macOS version, so here they are reported as not compared.
      - name: Screenshot and snapshot helpers on the fixture screens
        working-directory: tests/fixtures/visual
        run: swift test

      # The KeyboardCheck helper (linked into the fixture) presses keys on shared components:
      # Return, Escape, arrows and a Command shortcut reach their actions; a pointer-only card
      # is the negative control.
      - name: Keyboard helper on the fixture components
        working-directory: tests/fixtures/keyboard
        run: swift test

      # The Reduce Motion helpers of references/Tokens.swift: the override turns Reduce Motion
      # on in a test, and an animation through Motion.moving is then gone.
      - name: Reduce Motion helpers on a fixture component
        working-directory: tests/fixtures/design-system
        run: swift test --filter MotionTests

      - name: Upload the captured screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-fixture-screenshots
          path: |
            tests/fixtures/visual/.build/swift-harness/screenshots/
            tests/fixtures/visual/.build/swift-harness/snapshots/
          if-no-files-found: warn

      - name: swift-format template is accepted
        run: |
          tmp="$(mktemp -d)"
          cp plugins/swift-harness/skills/setup/templates/swift-format "$tmp/.swift-format"
          printf 'struct A {\nfunc f() -> Int {\nreturn 1\n}\n}\n' > "$tmp/A.swift"
          (cd "$tmp" && xcrun swift-format format A.swift) | tee "$tmp/out.swift"
          grep -q '^    func f' "$tmp/out.swift"

  ios-fixture:
    name: iOS fixture (verify.sh on a simulator)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' | head -5

      # The generated verify.sh on a package for macOS and iOS: fast builds both, full runs
      # the tests on macOS and on an iPhone simulator, and a negative control fails on iOS only.
      - name: tests/ios-fixture.sh --full
        run: /bin/bash tests/ios-fixture.sh --full

  accessibility-fixture:
    name: Accessibility audit fixture (UI tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: xcodebuild -version

      # The AccessibilityAudit template helper (linked into the fixture) in a real UI test:
      # the audit finds a button without a description, the fixed screen passes the full
      # audit, and an exception silences only its own issue.
      # FocusOrder (#52) needs Keyboard navigation on: buttons and toggles are in the Tab loop
      # only then. Without it, its tests skip.
      - name: Turn on Keyboard navigation
        run: defaults write -g AppleKeyboardUIMode -int 2

      - name: UI tests of tests/fixtures/accessibility
        working-directory: tests/fixtures/accessibility
        run: |
          xcodebuild test -project A11yFixture.xcodeproj -scheme A11yFixture -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/a11y.log" | grep -E 'Test Case|negative control|FocusOrder:|error:|TEST (SUCCEEDED|FAILED)'
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/a11y.log"
          # The focus order tests ran, not skipped.
          for t in testFocusOrderFollowsTheScreen testAWrongOrderFails testAControlOutOfTheTabLoopFails; do
            grep -q "FocusOrderTests $t\]' passed" "$RUNNER_TEMP/a11y.log" || { echo "FocusOrderTests $t did not pass (skipped?)"; exit 1; }
          done

  layout-audit-fixture:
    name: Layout audit fixture (UI tests, macOS and iOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E 'iPhone' | head -5

      # The LayoutAudit template helper (linked into the fixture) in real UI tests, on macOS at
      # the smallest window and on an iPhone simulator: it finds the two cut buttons and the
      # overlapping labels, nothing in the scrolling list, and the fixed screen passes.
      - name: UI tests of tests/fixtures/layout-audit (macOS)
        working-directory: tests/fixtures/layout-audit
        run: |
          xcodebuild test -project LayoutFixture.xcodeproj -scheme LayoutFixture -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/mac.log" | grep -E 'Test Case|LayoutAudit|error:|TEST (SUCCEEDED|FAILED)'
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/mac.log"
          grep -q 'LayoutAudit: window shrunk' "$RUNNER_TEMP/mac.log"

      - name: UI tests of tests/fixtures/layout-audit (iOS simulator)
        working-directory: tests/fixtures/layout-audit
        run: |
          SIM="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone")) | .name][0] // empty')"
          echo "iPhone simulator: ${SIM:-none}"
          [ -n "$SIM" ]
          xcodebuild test -project LayoutFixture.xcodeproj -scheme LayoutFixture -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath "$RUNNER_TEMP/dd" 2>&1 | tee "$RUNNER_TEMP/ios.log" | grep -E 'Test Case|LayoutAudit|error:|TEST (SUCCEEDED|FAILED)'
          grep -q 'TEST SUCCEEDED' "$RUNNER_TEMP/ios.log"
          grep -q "testTheLargestTextStillShowsTheOverlap\]' passed" "$RUNNER_TEMP/ios.log"

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Uses the latest Claude Code CLI from npm, so validator changes show up here first.
    # If a CLI release breaks this job without a real manifest problem, pin a version below.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude --version
      - run: claude plugin validate ./plugins/swift-harness
      - run: claude plugin validate .
